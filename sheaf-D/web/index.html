<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sheaf is a PDF toolkit that runs entirely on your own machine." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sheaf · PDF tools on your own machine</title>
    <script>
      try {
        var t = localStorage.getItem('sheaf-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
