# Builds the Sheaf-D image for Intel/AMD and ARM machines and publishes it to the GitHub
# container registry. Runs on every change to sheaf-D/ that lands on main, on a sheaf-d-v*
# tag, or by hand. Machines running docker-compose.ghcr.yml pick up :latest by themselves
# through Watchtower (see sheaf-D/README.md).
name: Sheaf-D image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sheaf-D/**', '.github/workflows/sheaf-d-image.yml']
    tags: ['sheaf-d-v*']

# A newer push replaces a build that is still running.
concurrency:
  group: sheaf-d-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 half of the image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sheaf-d
          tags: |
            type=match,pattern=sheaf-d-v(.*),group=1
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: sheaf-D
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
