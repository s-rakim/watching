# Builds the Sheaf-D image for Intel/AMD and ARM machines and publishes it to the GitHub
# container registry. Runs only when started by hand or when a sheaf-d-v* tag is pushed.
name: Sheaf-D image

on:
  workflow_dispatch:
  push:
    tags: ['sheaf-d-v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 half of the image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sheaf-d
          tags: |
            type=match,pattern=sheaf-d-v(.*),group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: sheaf-D
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
